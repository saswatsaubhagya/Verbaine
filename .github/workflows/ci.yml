name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # gh release create

jobs:
  build:
    # Needs Xcode 26 / macOS 26.4 SDK (SystemLanguageModel.tokenCount). Apple Silicon runner.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build number = commit count

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      # Model-dependent tests return early when Apple Intelligence is unavailable, so they pass on CI.
      - name: Test
        run: xcodebuild -project Verbaine.xcodeproj -scheme Verbaine -destination 'platform=macOS' test

      - name: Build Release (ad-hoc signed)
        if: github.event_name != 'pull_request'
        run: |
          VERSION=$(date -u +%Y.%-m.%-d) # e.g. 2026.9.24
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          xcodebuild -project Verbaine.xcodeproj -scheme Verbaine -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build/dd \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" \
            build
          APP=build/dd/Build/Products/Release/Verbaine.app
          codesign -dv "$APP"
          ditto -c -k --keepParent "$APP" "Verbaine-$VERSION.zip"

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ponytail: one release per day; a later build the same day replaces it.
          gh release delete "$VERSION" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$VERSION" Verbaine-*.zip --target "$GITHUB_SHA" \
            --title "$VERSION" --generate-notes \
            --notes "Ad-hoc signed. First launch: System Settings → Privacy & Security → Open Anyway (see README)."
